name: Sync public repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          path: private-source

      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          repository: kyungil-meta12/CT03-RedBreacher
          path: public-repo
          token: ${{ secrets.PUBLIC_SYNC_TOKEN }}

      - name: Build public-safe snapshot
        run: |
          mkdir public-snapshot

          # 외부 유료 에셋은 External Assets 폴더에 모아두고 공개 동기화에서 제외한다.
          rsync -av \
            --exclude='.git/***' \
            --exclude='.github/workflows/sync-public.yml' \
            --exclude='Assets/External Assets/***' \
            --exclude='Assets/External Assets.meta' \
            private-source/ public-snapshot/

      - name: Publish snapshot
        run: |
          rsync -av --delete --exclude='.git/' public-snapshot/ public-repo/

          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No public-safe changes to sync."
            exit 0
          fi

          git add -A
          git commit -m "Sync public-safe source snapshot"
          git push
